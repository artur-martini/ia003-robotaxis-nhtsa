[workspace]
authors = ["Artur Martini da Rosa"]
channels = ["conda-forge"]
name = "ia003_trabalho_final"
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]
version = "0.1.0"

[tasks]
baixar-dados = "python scripts/baixar_dados.py"
preparar-dados = "python scripts/preparar_dados.py"
sortear-amostra = "python scripts/sortear_amostra.py"
app = "streamlit run app.py"
testes = "pytest -q test"

[dependencies]
python = "3.12.*"
pandas = ">=2.2,<3"
numpy = ">=1.26,<3"
scipy = ">=1.13,<2"
streamlit = ">=1.64,<2"
plotly = ">=6,<8"
pytest = ">=8,<10"
